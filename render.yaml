# One Node service serves both the React app and WebSocket rooms.
services:
  - type: web
    name: sonara
    runtime: node
    plan: free
    rootDir: sonara
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: SONARA_ISSUER_SEED
        generateValue: true
